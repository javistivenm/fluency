{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fluency{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'fluency/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="shell header-layout">
            <a class="brand" href="{% url 'fluency:home' %}">Fluency</a>
            <nav class="site-nav">
                <a href="{% url 'fluency:home' %}">Home</a>
                <a href="{% url 'fluency:daily-challenge' %}">Daily Challenge</a>
            </nav>
        </div>
    </header>

    <main class="shell page-content">
        {% if messages %}
            <div class="message-stack">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
